name: Draft or Publish Release

on:
  push:
    tags:
      - 'v*' 

permissions:
  contents: write 

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # Check out the code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install dependencies to verify the build environment
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Package the application into a zip file
      - name: Package Application
        run: |
          zip -r python-app-release.zip . -x "*.git*" "*__pycache__*" "*.pytest_cache*" ".github/*"

      # Publish Release and attach the packaged application
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: python-app-release.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}